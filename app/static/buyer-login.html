<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buyer entry · BOUND</title><link rel="stylesheet" href="/static/styles.css"></head><body class="auth-page"><a class="brand auth-brand" href="/login"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" fill="none"><path d="M6 4v24h12l8-6-8-6 8-6-8-6H6Z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M6 16h12M12 10v12" stroke="currentColor" stroke-width="3"/></svg><span>BOUND</span></a><main class="auth-split"><figure class="auth-visual buyer-visual"><img src="/static/assets/buyer-shopping.png" alt="Curated shopping bag, skincare, keyboard and parcel"><figcaption><span>One shopping goal</span><b>Every store. Your rules.</b></figcaption></figure><section class="auth-form"><p class="eyebrow">Buyer prototype</p><h1>Start shopping with Bound</h1><p>Delegate the search.<br>Keep control of the purchase.</p><form id="buyer-entry"><label>Name<input id="buyer-entry-name" required autocomplete="name" value="Demo Buyer"></label><label>Email<input id="buyer-entry-email" required type="email" autocomplete="email" value="buyer@bound.demo"></label><button>Enter shopping workspace <b>→</b></button></form><small>Demo identity only. No password or production account is created.</small><a href="/login">← Back to Bound</a></section></main><script>document.querySelector('#buyer-entry').addEventListener('submit',e=>{e.preventDefault();sessionStorage.setItem('boundBuyer',JSON.stringify({name:document.querySelector('#buyer-entry-name').value,email:document.querySelector('#buyer-entry-email').value}));location.href='/dashboard'})</script></body></html>
