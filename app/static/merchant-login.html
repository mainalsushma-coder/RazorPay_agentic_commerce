<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Merchant entry · BOUND</title><link rel="stylesheet" href="/static/styles.css"></head><body class="auth-page merchant-auth"><a class="brand auth-brand" href="/login"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" fill="none"><path d="M6 4v24h12l8-6-8-6 8-6-8-6H6Z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M6 16h12M12 10v12" stroke="currentColor" stroke-width="3"/></svg><span>BOUND <em>for Merchants</em></span></a><main class="auth-split merchant-split"><figure class="auth-visual merchant-visual"><img src="/static/assets/merchant-catalog.png" alt="Products becoming an organized, verified commerce catalog"><figcaption><span>From catalog to commerce</span><b>Structured. Verified. Agent-ready.</b></figcaption></figure><section class="auth-form"><p class="eyebrow">Merchant prototype</p><h1>Make your catalog agent-ready</h1><p>Turn your product catalog into a trusted commerce surface for AI shoppers.</p><form id="merchant-entry"><label>Business name<input id="business-name" required value="GlowCare"></label><label>Merchant ID<input id="merchant-id" required value="glowcare"></label><label>Work email<input id="merchant-email" required type="email" value="ops@glowcare.demo"></label><button>Enter merchant console <b>→</b></button></form><small>Demo identity only. Catalog controls remain backend enforced.</small><a href="/login">← Back to Bound</a></section></main><script>document.querySelector('#merchant-entry').addEventListener('submit',e=>{e.preventDefault();sessionStorage.setItem('boundMerchant',JSON.stringify({name:document.querySelector('#business-name').value,merchant_id:document.querySelector('#merchant-id').value,email:document.querySelector('#merchant-email').value}));location.href='/merchant-portal'})</script></body></html>
